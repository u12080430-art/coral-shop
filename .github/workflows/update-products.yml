name: Update BASE products

on:
  schedule:
    # 毎日 15:00 UTC = 日本時間 深夜0:00 に実行
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-products:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Fetch BASE products and resize images
        working-directory: scripts
        env:
          BASE_CLIENT_ID: ${{ secrets.BASE_CLIENT_ID }}
          BASE_CLIENT_SECRET: ${{ secrets.BASE_CLIENT_SECRET }}
          BASE_REFRESH_TOKEN: ${{ secrets.BASE_REFRESH_TOKEN }}
          BASE_SHOP_DOMAIN: ${{ secrets.BASE_SHOP_DOMAIN }}
        run: npm run fetch-products

      - name: Update BASE_REFRESH_TOKEN secret if it rotated
        if: always()
        working-directory: scripts
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          if [ -f .new-refresh-token ]; then
            gh secret set BASE_REFRESH_TOKEN --repo "${{ github.repository }}" < .new-refresh-token
            rm -f .new-refresh-token
            echo "BASE_REFRESH_TOKENを更新しました。"
          else
            echo "refresh_tokenのローテーションはありませんでした。"
          fi

      - name: Commit and push updated product data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json products/
          git diff --cached --quiet || git commit -m "chore: update BASE products data"
          git push
